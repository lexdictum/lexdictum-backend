[project]
name = "lexdictum-backend"
version = "0.1.0"
description = "Spanish legal case management API for lawyers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic-settings>=2.6.0,<3",
    "supabase>=2.10.0,<3",
    "httpx>=0.28.0,<0.29",
    "qdrant-client>=1.12.0,<1.13",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30.0,<0.31",
    "python-jose[cryptography]>=3.3.0,<4",
    "python-multipart>=0.0.18,<0.1",
    "arq>=0.26.0,<0.27",
    "redis>=5.2.0,<6",
    "prometheus-fastapi-instrumentator>=7.0.0,<8",
    "sentry-sdk>=2.19.0,<3",
    "pymupdf>=1.25.0,<2",
    "python-docx>=1.1.0,<2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.3.0,<4",
    "torch>=2.5.0,<3",
]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "httpx>=0.28.0,<0.29",
    "ruff>=0.8.0,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring Supabase local or external services",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

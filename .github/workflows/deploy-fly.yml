name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: fly-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly app names
        id: apps
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" = "production" ]; then
            echo "api_app=lexdictum-api" >> "$GITHUB_OUTPUT"
            echo "worker_app=lexdictum-worker" >> "$GITHUB_OUTPUT"
          else
            echo "api_app=lexdictum-api-staging" >> "$GITHUB_OUTPUT"
            echo "worker_app=lexdictum-worker-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy API
        run: flyctl deploy --remote-only --app "${{ steps.apps.outputs.api_app }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy worker
        run: flyctl deploy --remote-only -c fly.worker.toml --app "${{ steps.apps.outputs.worker_app }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
